openapi: 3.0.3
info:
  title: KTPM Chat Room API
  version: 1.1.0
  description: |
    HTTP API for user authentication, chat rooms, room members and messages.
    Authenticated endpoints use the session ID returned by login as a Bearer token.
    Real-time events are delivered over Server-Sent Events (GET /api/events).
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Assets
  - name: Chat rooms
  - name: Room members
  - name: Messages
  - name: Real-time events

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check that the service is running
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user account
      description: Register a new user. The username is stored in lowercase. `display_name` defaults to `username` if omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: abcd
              password: "123456"
              display_name: Alice
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and create a session
      description: Logging in sets the user's presence to `ONLINE` and notifies everyone sharing a room with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: abcd
              password: "123456"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: End the current session
      description: Sets the user's presence to `OFFLINE` and closes the SSE streams opened with this session.
      security:
        - BearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's private profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/me:
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      description: Fields that are not sent are left unchanged. The avatar is set through `/api/user/me/avatar`.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              display_name: Alice
              presence: BUSY
              status_text: In a meeting
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/{id}:
    get:
      tags: [Users]
      summary: Get a user's public profile
      description: Authentication is optional. If supplied, an invalid or expired session is rejected.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/me/avatar:
    put:
      tags: [Users]
      summary: Set the authenticated user's avatar
      description: Only image files are accepted. Stored as `useravatars/<user uuid>.<extension>`, replacing the old one.
      security:
        - BearerAuth: []
      parameters:
        - name: X-File-Name
          in: header
          required: false
          description: Original file name, the extension decides the image type. Ignored for multipart uploads.
          schema:
            type: string
          example: avatar.png
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      summary: Remove the authenticated user's avatar
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/{id}/avatar:
    get:
      tags: [Users]
      summary: Get a user's avatar
      description: Authentication is not required, so the URL can be used directly in `<img>`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Avatar image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/assets/{id}:
    get:
      tags: [Assets]
      summary: Download a file
      description: Authentication is not required.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: The file
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events:
    get:
      tags: [Real-time events]
      summary: Subscribe to real-time events (Server-Sent Events)
      description: |
        Opens a Server-Sent Events stream for every room the user is in. The request must send `Accept: text/event-stream`.
        The session can also be passed as the `session_id` query parameter.
        Each data segment is `{"type": <event type>, "payload": "<JSON string>"}`. The payload is a string and has to be parsed again.
        Events missed during a disconnect are not replayed.

        | type | payload fields after parsing the JSON string |
        | :--- | :--- |
        | `CONNECTED` | `user_uuid` |
        | `MESSAGE_CREATED`, `MESSAGE_EDITED` | `ChatMessage` fields |
        | `MESSAGE_DELETED` | `room_uuid`, `message_uuid`, `deleted_by` |
        | `MEMBER_JOINED` | `room_uuid`, `user` (`User`) |
        | `MEMBER_LEFT` | `room_uuid`, `user` (`User`), `reason` |
        | `MEMBER_KICKED`, `MEMBER_BANNED`, `MEMBER_UNBANNED`, `MEMBER_MUTED`, `MEMBER_UNMUTED` | `room_uuid`, `user_uuid`, `actor_uuid`, `reason` |
        | `MEMBER_PERMISSIONS_CHANGED` | `room_uuid`, `user_uuid`, `actor_uuid`, `permission_bits` |
        | `OWNER_TRANSFERRED` | `room_uuid`, `old_owner`, `new_owner` |
        | `ROOM_UPDATED` | `RoomSummary` fields |
        | `ROOM_DELETED` | `room_uuid` |
        | `USER_UPDATED` | `User` fields |
      security:
        - BearerAuth: []
        - SessionQuery: []
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RealtimeEvent"
              example: |
                data: {"type":"CONNECTED","payload":"{\"user_uuid\":\"0b6b7d2e-3b4f-4e0e-8c2a-6a7d1b9a1c11\"}"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          description: The request does not accept `text/event-stream`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/chatrooms:
    post:
      tags: [Chat rooms]
      summary: Create a chat room
      description: The room is public by default. A private room's invite code is generated if omitted.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              name: General
              motd: Welcome to the room
              is_public: true
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoomResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/listing:
    get:
      tags: [Chat rooms]
      summary: List public chat rooms
      description: Authentication is optional. If supplied, an invalid or expired session is rejected. Newest rooms come first.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Public rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRoomListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/mine:
    get:
      tags: [Chat rooms]
      summary: List the rooms the authenticated user is in
      description: Includes private rooms. Rooms the user was banned from are not listed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Joined rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinedRoomListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/invite/{code}:
    get:
      tags: [Chat rooms]
      summary: Preview a room from an invite code or link
      description: Authentication is optional. The member list and invite code are not included.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "200":
          description: Room overview without members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/invite/{code}/join:
    post:
      tags: [Chat rooms]
      summary: Join a room with an invite code or link
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteCode"
      responses:
        "200":
          description: Joined the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinedRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}:
    patch:
      tags: [Chat rooms]
      summary: Change the name or MOTD of a room
      description: Requires the `MANAGE_ROOM` permission. Fields that are not sent are left unchanged.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
            example:
              name: General 2
              motd: New message of the day
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Chat rooms]
      summary: Delete a room
      description: Only the room owner can delete a room. Cascade deletes all messages, attachments, and memberships. Dispatches `ROOM_DELETED` event.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/overview:
    get:
      tags: [Chat rooms]
      summary: Get a chat room overview
      description: Authentication is optional for public rooms. Private rooms require membership.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/avatar:
    get:
      tags: [Chat rooms]
      summary: Get the avatar of a room
      description: Authentication is not required, so the URL can be used directly in `<img>`.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Avatar image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Chat rooms]
      summary: Set the avatar of a room
      description: Requires the `MANAGE_ROOM` permission. Only image files are accepted.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: X-File-Name
          in: header
          required: false
          description: Original file name, the extension decides the image type. Ignored for multipart uploads.
          schema:
            type: string
          example: logo.png
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Chat rooms]
      summary: Remove the avatar of a room
      description: Requires the `MANAGE_ROOM` permission.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/invite-code:
    post:
      tags: [Chat rooms]
      summary: Replace the invite code of a private room
      description: Requires the `MANAGE_ROOM` permission. A new code is generated if none is sent.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInviteCodeRequest"
            example:
              invite_code: my-new-code
      responses:
        "200":
          description: New invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/join:
    post:
      tags: [Chat rooms]
      summary: Join a chat room
      description: Private rooms require the invite code. Banned users cannot join.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
            example:
              room_invite_code: invite-code
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/leave:
    post:
      tags: [Chat rooms]
      summary: Leave a chat room
      description: The room owner cannot leave. With `silent_leave` the other members are not notified.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRoomRequest"
            example:
              silent_leave: false
              reason: Taking a break
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/members:
    get:
      tags: [Room members]
      summary: List the members of a room
      description: The caller must be in the room. Banned members are only listed with the `BAN_MEMBERS` permission.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Members of the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/members/{userId}/{action}:
    post:
      tags: [Room members]
      summary: Kick, ban, unban, mute or unmute a member
      description: |
        | Action | Permission |
        | :--- | :--- |
        | `kick` | `KICK_MEMBERS` |
        | `ban`, `unban` | `BAN_MEMBERS` |
        | `mute`, `unmute` | `MUTE_MEMBERS` |

        The room owner cannot be targeted. Only the owner can target an admin. Users cannot target themselves.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/TargetUserId"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [kick, ban, unban, mute, unmute]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationRequest"
            example:
              reason: Spam
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/members/{userId}/permissions:
    put:
      tags: [Room members]
      summary: Set the permissions of a member
      description: |
        Requires the `GRANT_PERMISSIONS` permission. Only the room owner can grant `GRANT_PERMISSIONS`. Admins cannot grant permissions they do not have, and users cannot modify their own permissions.

        | Bit | Value | Permission |
        | :--- | :--- | :--- |
        | 0 | 1 | `SEND_MESSAGES` |
        | 1 | 2 | `EDIT_MESSAGES` |
        | 2 | 4 | `DELETE_MESSAGES` |
        | 3 | 8 | `KICK_MEMBERS` |
        | 4 | 16 | `BAN_MEMBERS` |
        | 5 | 32 | `MANAGE_ROOM` |
        | 6 | 64 | `MUTE_MEMBERS` |
        | 7 | 128 | `GRANT_PERMISSIONS` |
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/TargetUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPermissionsRequest"
            example:
              permission_bits: 27
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/transfer-ownership:
    post:
      tags: [Room members]
      summary: Transfer the ownership of a room
      description: Only the room owner can transfer ownership. The new owner must be another member in the room.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipRequest"
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/history:
    get:
      tags: [Messages]
      summary: Get chat history
      description: |
        Authentication is optional. If supplied, an invalid or expired session is rejected.
        Results are returned from oldest to newest.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Limit"
        - name: before_message
          in: query
          required: false
          description: Message UUID used as the pagination cursor.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat messages, ordered oldest to newest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/search:
    get:
      tags: [Messages]
      summary: Search messages in a room
      description: Searches the message content, with the same pagination as the history endpoint.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: q
          in: query
          required: true
          description: Text to look for.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - name: before_message
          in: query
          required: false
          description: Message UUID used as the pagination cursor.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matching messages, ordered oldest to newest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/messages:
    post:
      tags: [Messages]
      summary: Send a message to a chat room
      description: Requires the `SEND_MESSAGES` permission and not being muted. Uploaded file contents are accepted as Base64.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              message_content: Hello, everyone!
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/chatrooms/{id}/messages/{messageId}:
    patch:
      tags: [Messages]
      summary: Edit a message
      description: Requires being the message author, having the `EDIT_MESSAGES` permission, and not being muted.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
            example:
              new_content: Updated message
              keep_attachments: false
      responses:
        "200":
          description: Edited message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Messages]
      summary: Delete a message
      description: The author, or a member with the `DELETE_MESSAGES` permission, can delete a message. Its attachments are deleted too.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session ID
      description: Use the session_id returned by POST /api/auth/login.
    SessionQuery:
      type: apiKey
      in: query
      name: session_id
      description: Same session ID as a query parameter, only accepted by GET /api/events.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetUserId:
      name: userId
      in: path
      required: true
      description: UUID of the member the operation is applied to.
      schema:
        type: string
        format: uuid
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50 and is capped at 100.
      schema:
        type: integer

  schemas:
    Error:
      type: object
      properties:
        error_message:
          type: string
      required: [error_message]
    User:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true
          description: URL of the avatar (`/api/user/{id}/avatar`), null when the user has none.
        presence:
          $ref: "#/components/schemas/Presence"
        status_text:
          type: string
          nullable: true
      required: [uuid, username, display_name, avatar, presence, status_text]
    Presence:
      type: string
      enum: [ONLINE, OFFLINE, AWAY, BUSY]
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9_.]{3,32}$"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 72
        display_name:
          type: string
          description: Defaults to username when omitted.
          minLength: 1
          maxLength: 64
      required: [username, password]
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required: [username, password]
    LoginResponse:
      type: object
      properties:
        session_id:
          type: string
      required: [session_id]
    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          description: 1-64 characters.
        presence:
          $ref: "#/components/schemas/Presence"
        status_text:
          type: string
          description: Up to 128 characters, an empty string clears it.
    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
          description: 1-64 characters.
        motd:
          type: string
          nullable: true
          description: Up to 512 characters.
        is_public:
          type: boolean
          default: true
        invite_code:
          type: string
          description: Optional invite code (4-32 letters, digits, `-` or `_`). Private rooms generate one when omitted. Ignored for public rooms.
      required: [name]
    CreateRoomResponse:
      type: object
      properties:
        room_uuid:
          type: string
          format: uuid
        invite_code:
          type: string
          nullable: true
        invite_link:
          type: string
          nullable: true
          description: Relative link that previews the room with GET; join with POST on `{invite_link}/join`.
      required: [room_uuid, invite_code, invite_link]
    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        motd:
          type: string
          maxLength: 512
    ResetInviteCodeRequest:
      type: object
      properties:
        invite_code:
          type: string
          pattern: "^[A-Za-z0-9_-]{4,32}$"
    InviteCode:
      type: object
      properties:
        invite_code:
          type: string
        invite_link:
          type: string
      required: [invite_code, invite_link]
    RoomSummary:
      type: object
      properties:
        roomUUID:
          type: string
          format: uuid
        name:
          type: string
        motd:
          type: string
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        members:
          type: integer
          description: Number of members currently in the room.
      required: [roomUUID, name, motd, avatar, createdAt, members]
    PublicRoomListing:
      type: object
      properties:
        public_rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomSummary"
      required: [public_rooms]
    JoinedRoomListing:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomSummary"
      required: [rooms]
    JoinedRoom:
      type: object
      properties:
        room_uuid:
          type: string
          format: uuid
      required: [room_uuid]
    RoomOverview:
      type: object
      properties:
        roomUUID:
          type: string
          format: uuid
        name:
          type: string
        motd:
          type: string
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        is_public:
          type: boolean
        owner:
          type: string
          description: Display name of the owner.
        owner_uuid:
          type: string
          format: uuid
        member_count:
          type: integer
        members:
          type: array
          description: First 50 members currently in the room.
          items:
            $ref: "#/components/schemas/User"
        invite_code:
          type: string
          nullable: true
          description: Only set for members with the MANAGE_ROOM permission.
      required: [roomUUID, name, motd, avatar, createdAt, is_public, owner, owner_uuid, member_count, members, invite_code]
    JoinRoomRequest:
      type: object
      properties:
        room_invite_code:
          type: string
    LeaveRoomRequest:
      type: object
      properties:
        silent_leave:
          type: boolean
          default: false
        reason:
          type: string
    Member:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            joined_at:
              type: integer
              format: int64
              description: Unix timestamp in milliseconds.
            permission_bits:
              type: integer
              description: Bit mask of the member's permissions (see the permissions endpoint).
            status_bits:
              type: integer
              description: "Bit mask of the member's status: 1 = muted, 2 = banned."
            is_in_room:
              type: boolean
              description: false for a banned member, whose relation is kept to block rejoining.
          required: [joined_at, permission_bits, status_bits, is_in_room]
    MemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
      required: [members]
    ModerationRequest:
      type: object
      properties:
        reason:
          type: string
    SetPermissionsRequest:
      type: object
      properties:
        permission_bits:
          type: integer
          minimum: 0
          maximum: 255
      required: [permission_bits]
    TransferOwnershipRequest:
      type: object
      properties:
        new_owner:
          type: string
          format: uuid
      required: [new_owner]
    UploadedFile:
      type: object
      description: Base64-encoded file attachment.
      properties:
        attachment:
          type: string
          format: byte
        file_name:
          type: string
          description: Original file name, the extension decides how the file is served.
      required: [attachment]
    SendMessageRequest:
      type: object
      properties:
        message_content:
          type: string
          nullable: true
          description: Up to 4000 characters; may be empty when files are attached.
        uploaded_files:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/UploadedFile"
    EditMessageRequest:
      type: object
      properties:
        new_content:
          type: string
          nullable: true
        keep_attachments:
          type: boolean
          default: false
    ChatMessage:
      type: object
      properties:
        chatMessageUUID:
          type: string
          format: uuid
        roomUUID:
          type: string
          format: uuid
        senderUUID:
          type: string
          format: uuid
        sender:
          type: string
          description: Sender's display name or username.
        content:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            type: string
            format: uri
        unixTimestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
      required: [chatMessageUUID, roomUUID, senderUUID, sender, content, attachments, unixTimestamp]
    MessageHistory:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required: [messages]
    RealtimeEvent:
      type: object
      description: One SSE data segment. `payload` is a JSON document encoded as a string.
      properties:
        type:
          type: string
          enum:
            - CONNECTED
            - MESSAGE_CREATED
            - MESSAGE_EDITED
            - MESSAGE_DELETED
            - MEMBER_JOINED
            - MEMBER_LEFT
            - MEMBER_KICKED
            - MEMBER_BANNED
            - MEMBER_UNBANNED
            - MEMBER_MUTED
            - MEMBER_UNMUTED
            - MEMBER_PERMISSIONS_CHANGED
            - OWNER_TRANSFERRED
            - ROOM_UPDATED
            - ROOM_DELETED
            - USER_UPDATED
        payload:
          type: string
      required: [type, payload]
  responses:
    EmptyObject:
      description: Operation completed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
          example: {}
    BadRequest:
      description: Invalid request, parameter, or JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is required or the session is invalid or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The operation is not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested user, room, message, or file was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
