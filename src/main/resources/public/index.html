<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ktpm chatroom (test client)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- left: account, rooms -->
  <div class="col" id="left">
    <div id="guest">
      <h4>account</h4>
      <input type="text" id="username" placeholder="username">
      <input type="password" id="password" placeholder="password">
      <input type="text" id="displayName" placeholder="display name (register only)">
      <button onclick="register()">register</button>
      <button onclick="login()">login</button>
    </div>

    <div id="user" class="hidden">
      <h4>me</h4>
      <div class="row"><span class="av big" id="meAvatar"></span><div><b id="meName"></b><br><span class="small" id="meSub"></span></div></div>
      <button onclick="logout()">logout</button>
      <details>
        <summary>edit profile</summary>
        <select id="mePresence">
          <option>ONLINE</option><option>OFFLINE</option><option>AWAY</option><option>BUSY</option>
        </select>
        <input type="text" id="meDisplay" placeholder="display name">
        <input type="text" id="meStatus" placeholder="status text">
        <button onclick="saveProfile()">save profile</button><br>
        avatar <input type="file" id="meFile" accept="image/*" style="width:120px">
        <button onclick="uploadAvatar()">upload</button>
        <button onclick="removeAvatar()">remove</button>
      </details>
    </div>

    <div id="roomtools" class="hidden">
      <h4>my rooms <button onclick="loadMine()" style="font-size:11px">refresh</button></h4>
      <div id="mine"></div>
    </div>

    <h4>public rooms <button onclick="loadPublic()" style="font-size:11px">refresh</button></h4>
    <div id="pub"></div>

    <details id="moretools" class="hidden">
      <summary>create room / join with code</summary>
      <h4>create room</h4>
      <input type="text" id="newName" placeholder="name">
      <input type="text" id="newMotd" placeholder="motd">
      <label><input type="checkbox" id="newPublic" checked> public</label>
      <input type="text" id="newCode" placeholder="invite code (private, blank = auto)">
      <button onclick="createRoom()">create</button>

      <h4>join with invite code</h4>
      <input type="text" id="joinCode" placeholder="invite code">
      <button onclick="previewInvite()">preview</button>
      <button onclick="joinInvite()">join</button>
    </details>
  </div>

  <!-- middle: chat -->
  <div class="col" id="center">
    <div id="header">
      <b id="roomTitle">no room selected</b>
      <span class="small grow" id="roomMotd"></span>
      <input type="text" id="searchQ" placeholder="search messages" style="width:150px" onkeydown="if(event.key==='Enter')search()">
      <button onclick="search()">search</button>
    </div>
    <div id="joinbar" class="hidden">
      <span id="joinMsg"></span>
      <input type="text" id="roomCode" placeholder="invite code" style="width:160px">
      <button id="joinBtn" onclick="joinCurrent()"><b>join room</b></button>
    </div>
    <div id="banner"></div>
    <div id="messages"></div>
    <div id="composer" class="hidden">
      <input type="text" id="content" placeholder="message (emoji ok)" onkeydown="if(event.key==='Enter')sendMessage()">
      <input type="file" id="files" multiple style="width:170px">
      <button id="recBtn" onclick="toggleRecord()">rec voice</button>
      <button onclick="sendMessage()">send</button>
    </div>
  </div>

  <!-- right: room info, members -->
  <div class="col" id="right">
    <div id="roomInfo" class="small">open a room</div>

    <div id="manage" class="hidden">
      <details><summary><b>manage room</b></summary>
      <input type="text" id="editName" placeholder="name">
      <input type="text" id="editMotd" placeholder="motd">
      <button onclick="saveRoom()">save</button><br>
      avatar <input type="file" id="roomFile" accept="image/*" style="width:120px">
      <button onclick="setRoomAvatar()">upload</button>
      <button onclick="delRoomAvatar()">remove</button><br>
      <span id="inviteBox">
        <button onclick="resetCode()">new invite code</button>
        <input type="text" id="customCode" placeholder="custom code (optional)" style="width:120px">
      </span>
      </details>
    </div>

    <div id="leaveBox" class="hidden">
      <h4>leave / delete</h4>
      <label><input type="checkbox" id="silent"> silent leave</label>
      <input type="text" id="reason" placeholder="reason (optional)">
      <button onclick="leaveRoom()" id="leaveBtn">leave</button>
      <button onclick="deleteRoom()" id="delBtn" class="hidden">delete room</button>
    </div>

    <div id="permBox" class="hidden">
      <h4>permissions: <span id="permWho"></span></h4>
      <div id="permChecks"></div>
      <button onclick="applyPerms()">apply</button>
      <button onclick="closePerms()">cancel</button>
    </div>

    <h4>members</h4>
    <div id="members" class="small">-</div>

    <details>
      <summary>realtime events (SSE)</summary>
      <div id="events"></div>
    </details>
    <details>
      <summary>raw log</summary>
      <div id="log"></div>
    </details>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
